name: Build Static Dinit (Full Files + Install Script)
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: ubuntu:26.04
    steps:
      - name: Install dependencies
        run: |
          apt update -y
          apt install -y --no-install-recommends build-essential git m4 libcap-dev ca-certificates

      - name: Checkout dinit source
        uses: actions/checkout@v4
        with:
          repository: davmac314/dinit
          ref: master

      - name: Build static dinit (OFFICIAL WAY)
        run: |
          make LDFLAGS="-static" -j$(nproc)

      # ------------ 以下是完全修复的文件打包逻辑 ------------
      - name: Prepare full package
        run: |
          # 清理并创建干净目录
          rm -rf dinit-full
          mkdir -p dinit-full
          mkdir -p dinit-full/bin
          mkdir -p dinit-full/man/man8
          mkdir -p dinit-full/man/man5

          # 拷贝所有二进制（官方全部 4 个工具）
          cp -a src/dinit          dinit-full/bin/
          cp -a src/dinitctl       dinit-full/bin/
          cp -a src/dinit-check    dinit-full/bin/
          cp -a src/dinit-monitor  dinit-full/bin/

          # 拷贝所有手册页
          cp -a doc/manpages/*.8   dinit-full/man/man8/
          cp -a doc/manpages/*.5   dinit-full/man/man5/

          # 拷贝文档
          cp -a README.md COPYING  dinit-full/

          # 一键安装脚本
          cat > dinit-full/install.sh <<'EOF'
          #!/bin/bash
          echo "=== Installing static Dinit (Ubuntu 26.04) ==="
          install -m 755 bin/* /usr/local/bin/
          install -m 644 man/man8/* /usr/local/man/man8/
          install -m 644 man/man5/* /usr/local/man/man5/
          echo "✅ Install complete!"
          echo "Try: dinit --version"
          EOF

          chmod +x dinit-full/install.sh

      # 验证文件
      - name: List all files
        run: |
          find dinit-full -type f | sort

      # 打包整个目录
      - name: Create archive
        run: |
          tar -czf dinit-static-ubuntu26.04-amd64-full.tar.gz dinit-full/

      # 上传给你下载
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dinit-static-ubuntu26.04-full
          path: dinit-static-ubuntu26.04-amd64-full.tar.gz
