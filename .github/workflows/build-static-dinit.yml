name: Build Static Dinit (Official BUILD)
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: ubuntu:26.04

    steps:
      - name: Install dependencies
        run: |
          apt update -y
          apt install -y --no-install-recommends build-essential git m4 libcap-dev ca-certificates

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          repository: davmac314/dinit
          ref: master

      - name: Build static dinit (OFFICIAL WAY)
        run: |
          make LDFLAGS="-static" -j$(nproc)

      - name: Verify static binary
        run: |
          ls -lh src/dinit
          ldd src/dinit || echo "✅ 静态编译成功！"
          src/dinit --version

      - name: Upload final static dinit
        uses: actions/upload-artifact@v4
        with:
          name: dinit-static-ubuntu26.04-amd64
          path: src/dinit
